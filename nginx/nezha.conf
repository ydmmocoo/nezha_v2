# Nezha v2 - nginx reverse proxy
# Web  :80  |  agent gRPC (TLS) :443 (self-signed)  ->  dashboard :8008

map $http_x_forwarded_for $xff_first_ip {
    default "";
    "~^(?P<first>[^,]+)" $first;
}
map $http_cf_connecting_ip $real_ip {
    default $xff_first_ip;
    "~.+"   $http_cf_connecting_ip;
}
map $real_ip $final_ip {
    default $remote_addr;
    "~.+"   $real_ip;
}

upstream dashboard {
    server 127.0.0.1:8008;
    keepalive 512;
}

server {
    listen 80;
    http2 on;
    underscores_in_headers on;

    location ^~ /proto.NezhaService/ {
        grpc_set_header Host $host;
        grpc_set_header nz-realip $final_ip;
        grpc_set_header CF-Connecting-IP $final_ip;
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
        grpc_socket_keepalive on;
        client_max_body_size 10m;
        grpc_buffer_size 4m;
        grpc_pass grpc://dashboard;
    }

    location ~* ^/api/v1/ws/(server|terminal|file)(.*)$ {
        proxy_set_header Host $host;
        proxy_set_header nz-realip $final_ip;
        proxy_set_header CF-Connecting-IP $final_ip;
        proxy_set_header Origin https://$host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8008;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header nz-realip $final_ip;
        proxy_set_header CF-Connecting-IP $final_ip;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 0;
        proxy_pass http://127.0.0.1:8008;
        # 剥离条件请求头，绕过 Nezha 后端的 304->200 bug
        proxy_set_header If-Modified-Since "";
        proxy_set_header If-None-Match "";
    }
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /app/nezha.pem;
    ssl_certificate_key /app/nezha.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    underscores_in_headers on;

    set $rip $remote_addr;
    if ($http_x_forwarded_for ~* "^([^,]+)") { set $rip $1; }
    if ($http_x_real_ip) { set $rip $http_x_real_ip; }
    if ($http_cf_connecting_ip) { set $rip $http_cf_connecting_ip; }

    location ^~ /proto.NezhaService/ {
        grpc_set_header Host $host;
        grpc_set_header nz-realip $rip;
        grpc_set_header CF-Connecting-IP $rip;
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
        grpc_socket_keepalive on;
        client_max_body_size 10m;
        grpc_buffer_size 4m;
        grpc_pass grpc://dashboard;
    }

    location ~* ^/api/v1/ws/(server|terminal|file)(.*)$ {
        proxy_set_header Host $host;
        proxy_set_header nz-realip $rip;
        proxy_set_header CF-Connecting-IP $rip;
        proxy_set_header Origin https://$host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8008;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header nz-realip $rip;
        proxy_set_header CF-Connecting-IP $rip;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 0;
        proxy_pass http://127.0.0.1:8008;
    }
}
