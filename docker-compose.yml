services:
  nezha-v2:
    build: .
    container_name: nezha-v2
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data:/app/data
    environment:
      FORCE_AUTH: "true"
      NZ_JWTSECRETKEY: "replace-with-a-long-random-secret"
      # Optional: pin the current V2 releases for reproducible deployments.
      # DASHBOARD_VERSION: "v2.3.4"
      # AGENT_VERSION: "v2.3.1"
